<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ações do Dia a Dia</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap');

  :root{
    --ink:#1F2A44;
    --paper:#FFFDF8;
    --bg:#E9F1EC;
    --bg-2:#DCEAE2;
    --accent:#FF6B4A;
    --accent-ink:#7A2E1E;
    --gold:#F2A93B;
    --success:#2F9E86;
    --success-bg:#DFF3EC;
    --cardback:#2F5D50;
    --cardback-2:#3E7365;
    --line:#1F2A44;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#EFEDE4;
      --paper:#20261F;
      --bg:#12261D;
      --bg-2:#0E1F17;
      --accent:#FF7A5C;
      --accent-ink:#FFD9CC;
      --gold:#F5BB5C;
      --success:#4FC3A8;
      --success-bg:#173B32;
      --cardback:#0E2A22;
      --cardback-2:#164236;
      --line:#EFEDE4;
    }
  }
  :root[data-theme="dark"]{
    --ink:#EFEDE4;
    --paper:#20261F;
    --bg:#12261D;
    --bg-2:#0E1F17;
    --accent:#FF7A5C;
    --accent-ink:#FFD9CC;
    --gold:#F5BB5C;
    --success:#4FC3A8;
    --success-bg:#173B32;
    --cardback:#0E2A22;
    --cardback-2:#164236;
    --line:#EFEDE4;
  }

  *{box-sizing:border-box;}
  html, body{ height:100%; }
  body{
    background: linear-gradient(180deg, var(--bg), var(--bg-2));
    color: var(--ink);
    font-family:'Nunito', system-ui, sans-serif;
    padding-inline: 12px;
    padding-block: 10px;
    height: 100dvh;
    overflow: hidden;
    display:flex;
  }

  .wrap{
    max-width: 1100px;
    margin: 0 auto;
    width: 100%;
    height: 100%;
    display:flex;
    flex-direction: column;
    min-height: 0;
  }

  header{ text-align:center; flex: 0 0 auto; }
  h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size: clamp(1.1rem, 2.6vw, 1.7rem);
    margin: 0;
    color: var(--ink);
    text-wrap: balance;
    line-height: 1.15;
  }
  .subtitle{
    font-weight:700;
    color: var(--success);
    font-size: 0.8rem;
    margin: 0;
  }
  .instructions{
    font-size: 0.78rem;
    opacity: 0.75;
    max-width: 60ch;
    margin: 2px auto 0;
    line-height: 1.25;
  }

  .statbar{
    display:flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content:center;
    align-items:center;
    flex: 0 0 auto;
    margin: 8px 0;
  }
  .stat{
    background: var(--paper);
    border: 2px solid var(--line);
    border-radius: 12px;
    padding: 4px 12px;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size: 0.85rem;
    display:flex;
    gap: 5px;
    align-items:baseline;
    box-shadow: 0 3px 0 var(--line);
  }
  .stat .num{ font-size:1rem; color: var(--accent); font-variant-numeric: tabular-nums; }
  .stat .lbl{ opacity:0.8; font-weight:600; }

  button.newgame{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size: 0.85rem;
    background: var(--accent);
    color: var(--paper);
    border: none;
    border-radius: 12px;
    padding: 7px 16px;
    cursor:pointer;
    box-shadow: 0 3px 0 var(--accent-ink);
    transition: transform 0.08s ease;
  }
  button.newgame:hover{ filter: brightness(1.05); }
  button.newgame:active{ transform: translateY(2px); box-shadow: 0 1px 0 var(--accent-ink); }
  button.newgame:focus-visible{ outline: 3px solid var(--gold); outline-offset: 2px; }

  .board{
    display:grid;
    gap: 7px;
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
  }

  .cell{
    perspective: 900px;
    min-width: 0;
    min-height: 0;
  }
  .card{
    position:relative;
    width:100%; height:100%;
    cursor:pointer;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(.4,.2,.2,1);
  }
  @media (prefers-reduced-motion: reduce){
    .card{ transition: none; }
  }
  .card.flipped{ transform: rotateY(180deg); }
  .card.matched{ cursor:default; }
  .card.matched .face{ box-shadow: 0 0 0 3px var(--success) inset; }

  .face{
    position:absolute; inset:0;
    backface-visibility: hidden;
    border-radius: 12px;
    display:flex; align-items:center; justify-content:center;
    padding: 6px;
  }
  .face.back{
    background:
      repeating-linear-gradient(135deg, var(--cardback-2) 0 6px, var(--cardback) 6px 12px);
    border: 2px solid var(--line);
  }
  .face.back::after{
    content: "?";
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size: clamp(1.4rem, 5vw, 2rem);
    color: var(--paper);
    opacity:0.85;
  }
  .face.front{
    background: var(--paper);
    border: 2px solid var(--line);
    transform: rotateY(180deg);
    flex-direction:column;
    gap: 4px;
    overflow:hidden;
  }
  .card.matched .face.front{ background: var(--success-bg); }

  .front .art{
    width: 70%;
    height: 60%;
  }
  .front .art svg{ width:100%; height:100%; display:block; }
  .front.photo-card .art{
    width: 100%;
    height: 100%;
  }
  .front.photo-card .art img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 8px;
    display: block;
  }
  .card.matched .face.front.photo-card .art img{ opacity: 0.92; }

  .front .word{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    text-align:center;
    font-size: clamp(0.62rem, 2.6vw, 0.95rem);
    line-height:1.15;
    padding: 0 4px;
    color: var(--ink);
  }

  .front.text-card{ justify-content:center; }

  dialog.win{
    border:none;
    border-radius: 18px;
    padding: 0;
    background: transparent;
    max-width: 92vw;
  }
  dialog.win::backdrop{ background: rgba(15, 30, 22, 0.55); }
  .win-card{
    background: var(--paper);
    border: 3px solid var(--line);
    border-radius: 18px;
    padding: 28px 26px;
    text-align:center;
    max-width: 360px;
    box-shadow: 0 8px 0 var(--line);
  }
  .win-card h2{
    font-family:'Baloo 2', sans-serif;
    color: var(--success);
    margin: 0 0 8px;
    font-size: 1.6rem;
  }
  .win-card p{ margin: 4px 0 18px; font-weight:600; }
  .win-card .score-line{ font-size: 1.05rem; }

  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <p class="subtitle">Portuguese 1101</p>
    <h1>Jogo da Memória: Ações do Dia a Dia</h1>
    <p class="instructions">Encontre os pares: uma carta com a frase e uma carta com o desenho da ação. Clique em duas cartas para ver se combinam.</p>
  </header>

  <div class="statbar">
    <div class="stat"><span class="num" id="moves">0</span><span class="lbl">jogadas</span></div>
    <div class="stat"><span class="num" id="found">0</span><span class="lbl">/ 14 pares</span></div>
    <div class="stat"><span class="num" id="timer">0:00</span><span class="lbl">tempo</span></div>
    <button class="newgame" id="newgame">Novo jogo</button>
  </div>

  <div class="board" id="board" aria-label="Tabuleiro do jogo da memória"></div>
</div>

<dialog class="win" id="winDialog">
  <div class="win-card">
    <h2>Parabéns! 🎉</h2>
    <p>Você encontrou todos os pares.</p>
    <p class="score-line" id="winStats"></p>
    <button class="newgame" id="playAgain">Jogar novamente</button>
  </div>
</dialog>

  var PAIRS = [
    {id:"beber", text:"BEBER ÁGUA"},
    {id:"cafe", text:"TOMAR CAFÉ"},
    {id:"estudar", text:"ESTUDAR PORTUGUÊS"},
    {id:"filme", text:"ASSISTIR UM FILME"},
    {id:"caminhar", text:"CAMINHAR NO PARQUE"},
    {id:"discutir", text:"DISCUTIR UM LIVRO"},
    {id:"ingles", text:"FALAR INGLÊS"},
    {id:"comer", text:"COMER NO RESTAURANTE"},
    {id:"videogame", text:"JOGAR VIDEOGAME"},
    {id:"futebol", text:"PRATICAR FUTEBOL"},
    {id:"musica", text:"ESCUTAR MÚSICA"},
    {id:"partida", text:"ASSISTIR UMA PARTIDA DE FUTEBOL"},
    {id:"acordar", text:"ACORDAR CEDO"},
    {id:"dancar", text:"DANÇAR NA FESTA"}
  ];

  var boardEl = document.getElementById('board');
  var movesEl = document.getElementById('moves');
  var foundEl = document.getElementById('found');
  var timerEl = document.getElementById('timer');
  var newGameBtn = document.getElementById('newgame');
  var winDialog = document.getElementById('winDialog');
  var winStats = document.getElementById('winStats');
  var playAgainBtn = document.getElementById('playAgain');

  var state = {
    cards: [],
    flipped: [],
    matched: 0,
    moves: 0,
    lock: false,
    seconds: 0,
    timerHandle: null,
    started: false
  };

  function shuffle(arr){
    for(var i = arr.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i+1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }

  function formatTime(s){
    var m = Math.floor(s/60);
    var ss = s % 60;
    return m + ":" + (ss < 10 ? "0" : "") + ss;
  }

  function startTimer(){
    if(state.timerHandle) return;
    state.timerHandle = setInterval(function(){
      state.seconds++;
      timerEl.textContent = formatTime(state.seconds);
    }, 1000);
  }
  function stopTimer(){
    clearInterval(state.timerHandle);
    state.timerHandle = null;
  }

  function buildDeck(){
    var deck = [];
    PAIRS.forEach(function(p){
      deck.push({pairId: p.id, kind:'text', content: p.text});
      var isPhoto = !!PHOTOS[p.id];
      deck.push({pairId: p.id, kind:'image', isPhoto: isPhoto, content: isPhoto ? PHOTOS[p.id] : ICONS[p.id]});
    });
    return shuffle(deck);
  }

  function render(){
    boardEl.innerHTML = '';
    state.cards.forEach(function(card, idx){
      var cell = document.createElement('div');
      cell.className = 'cell';

      var btn = document.createElement('div');
      btn.className = 'card';
      btn.setAttribute('role','button');
      btn.setAttribute('tabindex','0');
      btn.dataset.index = idx;
      var label = card.kind === 'text' ? card.content : 'imagem da ação';
      btn.setAttribute('aria-label', 'Carta ' + (idx+1) + ', ' + label);

      var back = document.createElement('div');
      back.className = 'face back';

      var front = document.createElement('div');
      front.className = 'face front' + (card.kind === 'text' ? ' text-card' : (card.isPhoto ? ' photo-card' : ''));
      if(card.kind === 'text'){
        var w = document.createElement('div');
        w.className = 'word';
        w.textContent = card.content;
        front.appendChild(w);
      } else {
        var art = document.createElement('div');
        art.className = 'art';
        if(card.isPhoto){
          var img = document.createElement('img');
          img.src = card.content;
          img.alt = '';
          img.draggable = false;
          art.appendChild(img);
        } else {
          art.innerHTML = card.content;
        }
        front.appendChild(art);
      }

      btn.appendChild(back);
      btn.appendChild(front);
      cell.appendChild(btn);
      boardEl.appendChild(cell);

      btn.addEventListener('click', function(){ handleFlip(idx); });
      btn.addEventListener('keydown', function(e){
        if(e.key === 'Enter' || e.key === ' '){
          e.preventDefault();
          handleFlip(idx);
        }
      });
    });
    layoutBoard();
  }

  // Picks a column/row count so every card is visible at once, with no
  // page scrolling, keeping cards close to a comfortable card-like shape.
  function layoutBoard(){
    var count = state.cards.length;
    if(!count) return;
    var w = boardEl.clientWidth;
    var h = boardEl.clientHeight;
    if(w <= 0 || h <= 0) return;

    var gap = 7;
    var idealAspect = 0.76; // slightly taller than wide
    var minCardSize = 34;
    var best = null;

    for(var cols = 1; cols <= count; cols++){
      var rows = Math.ceil(count / cols);
      var cardW = (w - gap * (cols - 1)) / cols;
      var cardH = (h - gap * (rows - 1)) / rows;
      if(cardW < minCardSize || cardH < minCardSize) continue;
      var aspect = cardW / cardH;
      var aspectScore = -Math.abs(Math.log(aspect / idealAspect));
      var sizeScore = Math.log(Math.min(cardW, cardH));
      var score = aspectScore * 4 + sizeScore;
      if(!best || score > best.score){
        best = {cols: cols, rows: rows, score: score};
      }
    }

    if(!best){
      var cols2 = w < 420 ? 3 : (w < 760 ? 4 : 7);
      best = {cols: cols2, rows: Math.ceil(count / cols2)};
    }

    boardEl.style.gridTemplateColumns = 'repeat(' + best.cols + ', 1fr)';
    boardEl.style.gridTemplateRows = 'repeat(' + best.rows + ', 1fr)';
  }

  var layoutResizeHandle = null;
  window.addEventListener('resize', function(){
    clearTimeout(layoutResizeHandle);
    layoutResizeHandle = setTimeout(layoutBoard, 100);
  });

  function handleFlip(idx){
    if(state.lock) return;
    var card = state.cards[idx];
    if(card.matchedFlag || state.flipped.indexOf(idx) !== -1) return;

    if(!state.started){
      state.started = true;
      startTimer();
    }

    var cellEl = boardEl.children[idx].firstChild;
    cellEl.classList.add('flipped');
    state.flipped.push(idx);

    if(state.flipped.length === 2){
      state.moves++;
      movesEl.textContent = state.moves;
      state.lock = true;
      var i1 = state.flipped[0], i2 = state.flipped[1];
      var c1 = state.cards[i1], c2 = state.cards[i2];

      if(c1.pairId === c2.pairId){
        c1.matchedFlag = true; c2.matchedFlag = true;
        state.matched++;
        foundEl.textContent = state.matched;
        var el1 = boardEl.children[i1].firstChild;
        var el2 = boardEl.children[i2].firstChild;
        el1.classList.add('matched');
        el2.classList.add('matched');
        state.flipped = [];
        state.lock = false;

        if(state.matched === PAIRS.length){
          stopTimer();
          setTimeout(function(){
            winStats.textContent = state.moves + ' jogadas em ' + formatTime(state.seconds) + '.';
            if(typeof winDialog.showModal === 'function'){
              winDialog.showModal();
            }
          }, 500);
        }
      } else {
        setTimeout(function(){
          boardEl.children[i1].firstChild.classList.remove('flipped');
          boardEl.children[i2].firstChild.classList.remove('flipped');
          state.flipped = [];
          state.lock = false;
        }, 900);
      }
    }
  }

  function newGame(){
    stopTimer();
    state.cards = buildDeck();
    state.flipped = [];
    state.matched = 0;
    state.moves = 0;
    state.lock = false;
    state.seconds = 0;
    state.started = false;
    movesEl.textContent = '0';
    foundEl.textContent = '0';
    timerEl.textContent = '0:00';
    if(winDialog.open) winDialog.close();
    render();
  }

  newGameBtn.addEventListener('click', newGame);
  playAgainBtn.addEventListener('click', function(){
    winDialog.close();
    newGame();
  });

  // hot-reload state for viewers with the page already open (keeps in-progress game on republish)
  function snapshot(){
    return {
      cards: state.cards.map(function(c){ return {pairId:c.pairId, kind:c.kind, matchedFlag: !!c.matchedFlag}; }),
      moves: state.moves, matched: state.matched, seconds: state.seconds, started: state.started
    };
  }
  function boot(data){
    if(data && data.cards && data.cards.length === PAIRS.length * 2){
      state.cards = data.cards.map(function(c){
        var isPhoto = !!PHOTOS[c.pairId];
        var content = c.kind === 'text'
          ? PAIRS.filter(function(p){return p.id === c.pairId;})[0].text
          : (isPhoto ? PHOTOS[c.pairId] : ICONS[c.pairId]);
        return {pairId:c.pairId, kind:c.kind, isPhoto: c.kind === 'image' ? isPhoto : false, content:content, matchedFlag:c.matchedFlag};
      });
      state.moves = data.moves || 0;
      state.matched = data.matched || 0;
      state.seconds = data.seconds || 0;
      state.started = !!data.started;
      movesEl.textContent = state.moves;
      foundEl.textContent = state.matched;
      timerEl.textContent = formatTime(state.seconds);
      render();
      state.cards.forEach(function(c, idx){
        if(c.matchedFlag){
          var el = boardEl.children[idx].firstChild;
          el.classList.add('flipped','matched');
        }
      });
      if(state.started && state.matched < PAIRS.length){ startTimer(); }
    } else {
      newGame();
    }
  }
  try{
    if(window.claude && window.claude.hot){
      window.claude.hot.snapshot(snapshot);
      window.claude.hot.ready ? window.claude.hot.ready(boot) : boot(window.claude.hot.data);
    } else {
      newGame();
    }
  } catch(e){ newGame(); }

})();
</script>
</body>
</html>
